<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Discipline OS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: 
                radial-gradient(1400px 600px at 50% -10%, rgba(16, 185, 129, 0.12), transparent 65%),
                radial-gradient(1000px 500px at 90% 110%, rgba(13, 148, 136, 0.08), transparent 70%),
                radial-gradient(800px 400px at 10% 90%, rgba(4, 47, 46, 0.15), transparent 60%),
                #04070D;
            color: #e2e8f0;
        }
        
        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        .background-number {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 0;
        }
        
        .background-number span {
            font-size: 14rem;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            color: rgba(16, 185, 129, 0.08);
            letter-spacing: -0.02em;
            user-select: none;
        }
        
        .content {
            position: relative;
            z-index: 1;
            max-width: 400px;
            width: 100%;
            text-align: center;
            background: rgba(11, 19, 29, 0.7);
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-radius: 2rem;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .error-code {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #10b981;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .error-title {
            font-size: 2.25rem;
            font-weight: 800;
            color: white;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        
        .error-description {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            padding: 0.75rem 1.5rem;
            border-radius: 1rem;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .btn-primary {
            background: linear-gradient(to right, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        
        .btn-primary:hover {
            background: linear-gradient(to right, #059669, #047857);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        
        .btn-outline {
            border: 2px solid rgba(16, 185, 129, 0.3);
            background: rgba(16, 185, 129, 0.05);
            color: #a7f3d0;
        }
        
        .btn-outline:hover {
            background: rgba(16, 185, 129, 0.1);
            border-color: #10b981;
            color: #bbf7d0;
        }
        
        .icon {
            width: 1.25rem;
            height: 1.25rem;
            display: inline-block;
        }
        
        /* For browsers that don't support backdrop-filter */
        @supports not (backdrop-filter: blur(10px)) {
            .content {
                background: rgba(11, 19, 29, 0.85);
            }
        }
        
        @media (max-width: 480px) {
            .background-number span {
                font-size: 8rem;
            }
            
            .error-title {
                font-size: 1.75rem;
            }
            
            .button-group {
                flex-direction: column;
                align-items: stretch;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background-number">
            <span>404</span>
        </div>
        
        <div class="content">
            <p class="error-code">Error 404</p>
            <h1 class="error-title">Page not found</h1>
            <p class="error-description">
                The page you're looking for might have been moved or doesn't exist in Discipline OS.
            </p>
            
            <div class="button-group">
                <a href="/" class="btn btn-primary">
                    <span class="icon">◎</span>
                    Return Today
                </a>
                <a href="/gym" class="btn btn-outline">
                    <span class="icon">🏋</span>
                    View Gym Split
                </a>
            </div>
        </div>
    </div>
</body>
</html>
