name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` runs the full TypeScript check internally (and generates
      # next-env.d.ts + route types that a standalone tsc would miss).
      - name: Build
        run: npm run build
        env:
          # Placeholder values so the production build can inline *something*;
          # the app degrades gracefully to local-only mode without real ones.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
